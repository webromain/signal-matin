# Lancer une edition :  docker compose run --rm signal-matin
# Le PDF arrive dans ./output/pdf/, comme sans Docker.
services:
  signal-matin:
    build: .
    image: signal-matin:local
    # Meme utilisateur que sur la machine, pour que les fichiers de output/ t'appartiennent.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: Europe/Paris
      GOOGLE_CREDENTIALS_FILE: credentials.json
      GOOGLE_TOKEN_FILE: token.json
      # Lus par Compose dans le fichier .env du dossier, absent de l'image.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/app/output
      # Google Agenda : le jeton est reecrit quand Google le renouvelle.
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
